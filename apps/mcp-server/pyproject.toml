[project]
name = "reelix-mcp-server"
version = "0.1.0"
description = "MCP server exposing the Reelix recommendation pipeline over stdio"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "reelix-core",
  "pydantic-settings",
  "python-dotenv",
  "qdrant-client",
  "httpx>=0.27.0",
  "nltk>=3.9.3",
  "torch>=2.10.0",
  "rank_bm25",
  "sentence_transformers",
  "redis>=5.0",
  "openai",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-semantic-conventions",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-httpx",
  "opentelemetry-instrumentation-redis",
]

[tool.uv.sources]
"reelix-core" = { path = "../../packages/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.12.12",
]
